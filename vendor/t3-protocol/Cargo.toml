[package]
name = "t3-protocol"
version = "0.3.7"
edition = "2021"
license = "MIT"
repository = "https://github.com/avillagran/lib-t3-rust"
readme = "README.md"
keywords = ["t3", "protocol", "android", "ffi"]

description = "Portable native T3 Code transport and DPoP authorization for Omarchy and Omi"

[lib]
crate-type = ["rlib", "staticlib"]

[dependencies]
pulldown-cmark = { version = "0.13", default-features = false }
chrono = "0.4"
base64 = "0.22"
p256 = { version = "0.13", features = ["ecdsa"] }
rand_core = { version = "0.6", features = ["getrandom"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = "1"
serde_json = { version = "1", features = ["raw_value"] }
sha2 = "0.10"
tungstenite = { version = "0.28", default-features = false, features = ["handshake", "rustls-tls-webpki-roots"] }
uuid = { version = "1", features = ["v4"] }
zeroize = "1"
unicode-normalization = "=0.1.25"
bytes = "1"
http-body = "1"
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }
tokio = { version = "1", features = ["rt", "net", "time"] }
tokio-tungstenite = { version = "0.28", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
socket2 = "0.6"
