<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
html,body{margin:0;background:transparent;color:var(--foreground,#d6d6d6);font-family:var(--font-sans,system-ui)}*{box-sizing:border-box}nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}button{font:inherit;padding:7px 12px;border:1px solid var(--border,#444);border-radius:var(--radius,8px);background:transparent;color:inherit;cursor:pointer}button[aria-pressed=true]{background:var(--accent-surface,#343434);border-color:var(--accent,#bdad86)}.comparison{display:grid;grid-template-columns:1fr 1fr;gap:12px}figure{margin:0;min-width:0}figcaption{margin-bottom:8px;color:var(--muted-foreground,#aaa)}img{display:block;width:100%;height:auto;border:1px solid var(--border,#444);border-radius:var(--radius,8px)}small{display:block;margin-top:12px;color:var(--muted-foreground,#aaa)}@media(max-width:470px){.comparison{grid-template-columns:1fr}}
</style></head><body><nav aria-label="Pantalla comparada"><button data-screen="general" aria-pressed="true">General</button><button data-screen="appearance" aria-pressed="false">Apariencia</button><button data-screen="source-control" aria-pressed="false">Control de versiones</button></nav><div class="comparison"><figure><figcaption>T3 Code original</figcaption><img id="native" alt="Pantalla original de T3 Code" src="/home/avillagran/Work/omarchy-t3-code/docs/audit/screenshots/native-settings-general-dark.png"></figure><figure><figcaption>ot3 actual</figcaption><img id="ot3" alt="Pantalla actual de ot3" src="/home/avillagran/Work/omarchy-t3-code/docs/audit/screenshots/ot3-settings-general.png"></figure></div><small id="note">Capturas reales con datos y escalas diferentes: comparación de estructura, no equivalencia de píxeles.</small><template id="audit-assets"><img data-side="native" data-screen="general" src="/home/avillagran/Work/omarchy-t3-code/docs/audit/screenshots/native-settings-general-dark.webp"><img data-side="ot3" data-screen="general" src="/home/avillagran/Work/omarchy-t3-code/docs/audit/screenshots/ot3-settings-general.webp"><img data-side="native" data-screen="appearance" src="/home/avillagran/Work/omarchy-t3-code/docs/audit/screenshots/native-settings-appearance-dark.webp"><img data-side="ot3" data-screen="appearance" src="/home/avillagran/Work/omarchy-t3-code/docs/audit/screenshots/ot3-settings-appearance.webp"><img data-side="native" data-screen="source-control" src="/home/avillagran/Work/omarchy-t3-code/docs/audit/screenshots/native-settings-source-control-dark.webp"><img data-side="ot3" data-screen="source-control" src="/home/avillagran/Work/omarchy-t3-code/docs/audit/screenshots/ot3-settings-source-control.webp"></template><script>
const assets=[...document.getElementById('audit-assets').content.querySelectorAll('img')];function source(screen,side){return assets.find(a=>a.dataset.screen===screen&&a.dataset.side===side).getAttribute('src')}const buttons=[...document.querySelectorAll('[data-screen]')];function show(screen){document.getElementById('native').src=source(screen,'native');document.getElementById('ot3').src=source(screen,'ot3');buttons.forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.screen===screen)));document.getElementById('note').textContent=screen==='source-control'?'La referencia nativa incluye secciones en carga. Datos y escalas diferentes; comparación estructural.':'Capturas reales con datos y escalas diferentes: comparación de estructura, no equivalencia de píxeles.'}buttons.forEach(b=>b.addEventListener('click',()=>show(b.dataset.screen)));for(const b of buttons){b.click();if(document.getElementById('native').getAttribute('src')!==source(b.dataset.screen,'native')||document.getElementById('ot3').getAttribute('src')!==source(b.dataset.screen,'ot3'))throw Error('Comparison did not change');}show('general');console.log('AUDIT_COMPARE_PASS: all three selections update both observed captures');
</script></body></html>
